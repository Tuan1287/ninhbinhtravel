<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Bình AI - Local Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .map-frame { width: 100%; height: 350px; border-radius: 20px; border: 1px solid #ddd; margin-top: 15px; }
    </style>
</head>
<body class="text-slate-800">

    <div id="api-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] hidden p-4">
        <div class="bg-white p-6 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <h3 class="text-lg font-bold mb-4">Nhập Gemini API Key</h3>
            <input type="password" id="api-input" class="w-full p-4 border rounded-2xl mb-4 text-center">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white py-3 rounded-2xl font-bold">Lưu & Khởi động</button>
        </div>
    </div>

    <header class="h-16 flex justify-between items-center bg-white border-b px-4 sm:px-8 shrink-0 z-50 shadow-sm">
        <div class="flex items-center space-x-4">
            <div class="cursor-pointer" onclick="goHome()">
                <h1 class="text-base font-bold text-emerald-700">Ninh Bình AI</h1>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span class="text-[10px] text-slate-400 italic hidden sm:block">Thông tin mang tính chất tham khảo</span>
            
            <button onclick="clearChat()" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button onclick="showApiModal()" class="p-2 text-amber-500 hover:bg-amber-50 rounded-lg">
                <i class="fas fa-key"></i>
            </button>
            <button onclick="toggleLang()" id="langBtn" class="px-3 py-1 border-2 border-emerald-600 text-emerald-600 rounded-lg text-xs font-bold">EN</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full relative flex-1 flex flex-col overflow-hidden">
        <div id="chat-window" class="flex-1 overflow-y-auto px-4 pt-6 pb-32">
            <div id="welcome-screen" class="py-10 text-center">
                <h2 class="text-3xl font-bold mb-8" id="w-text">Lịch trình & Giá vé Ninh Bình 2026</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div onclick="askAI(translations[currentLang].sug1)" class="p-6 bg-white border rounded-2xl cursor-pointer hover:border-emerald-500 shadow-sm transition-all text-left">
                        <i class="fas fa-route text-emerald-500 mb-2"></i>
                        <h3 class="font-bold text-sm">Lịch trình 2N1Đ chi tiết</h3>
                        <p class="text-[10px] text-slate-400 mt-1">Sắp xếp các điểm tham quan gần nhau để tiết kiệm thời gian.</p>
                    </div>
                    <div onclick="askAI(translations[currentLang].sug2)" class="p-6 bg-white border rounded-2xl cursor-pointer hover:border-orange-500 shadow-sm transition-all text-left">
                        <i class="fas fa-ticket-alt text-orange-500 mb-2"></i>
                        <h3 class="font-bold text-sm">Cập nhật giá vé mới nhất</h3>
                        <p class="text-[10px] text-slate-400 mt-1">Tràng An 300k, Hang Múa 150k và các điểm khác.</p>
                    </div>
                </div>
            </div>
            <div id="chat-container" class="space-y-6"></div>
        </div>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-slate-50 to-transparent">
            <div class="max-w-2xl mx-auto relative shadow-2xl rounded-2xl bg-white border p-1">
                <input type="text" id="userInput" placeholder="Hỏi mình về lịch trình hoặc giá vé..." 
                    class="w-full p-4 pr-16 focus:outline-none text-sm"
                    onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" class="absolute right-2 top-2 bg-emerald-600 text-white w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentLang = 'vi';
        let chatHistory = []; // Bộ nhớ trò chuyện

        const translations = {
            vi: {
                wText: "Lịch trình & Giá vé Ninh Bình 2026",
                sug1: "Lập lịch trình 2 ngày 1 đêm chi tiết: đi Tràng An, Hang Múa, Bái Đính. Nhóm các điểm gần nhau, gợi ý khách sạn và nhà hàng.",
                sug2: "Cho tôi danh sách giá vé mới nhất 2026 các điểm ở Ninh Bình.",
                thinking: "Đang tính toán..."
            },
            en: {
                wText: "Ninh Binh Itinerary & Tickets 2026",
                sug1: "Create a detailed 2D1N trip: Trang An, Mua Cave, Bai Dinh. Group nearby spots, suggest hotels and restaurants.",
                sug2: "Show me the latest 2026 ticket prices for Ninh Binh.",
                thinking: "Thinking..."
            }
        };

        function toggleLang() { currentLang = currentLang === 'vi' ? 'en' : 'vi'; document.getElementById('langBtn').innerText = currentLang === 'vi' ? 'EN' : 'VI'; }
        function showApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function saveApiKey() {
            const val = document.getElementById('api-input').value.trim();
            if(val) { apiKey = val; localStorage.setItem('gemini_api_key', val); document.getElementById('api-modal').classList.add('hidden'); }
        }

        async function askAI(question) {
            if(!apiKey) return showApiModal();
            document.getElementById('welcome-screen').classList.add('hidden');
            const container = document.getElementById('chat-container');
            const isMap = question.toLowerCase().includes('lịch trình') || question.toLowerCase().includes('itinerary');

            container.innerHTML += `<div class="flex justify-end mb-2"><div class="bg-emerald-600 text-white p-3 px-5 rounded-2xl rounded-tr-none max-w-[85%] text-sm">${question}</div></div>`;
            
            const aiBox = document.createElement('div');
            aiBox.className = "flex justify-start mb-4";
            aiBox.innerHTML = `<div class="bg-white p-5 rounded-2xl rounded-tl-none max-w-[95%] text-sm text-slate-700 border border-slate-100 italic text-slate-300 shadow-sm">${translations[currentLang].thinking}</div>`;
            container.appendChild(aiBox);
            const contentElement = aiBox.querySelector('div');
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;

            try {
                const resData = await fetch('data.json');
                const rag = await resData.json();
                const ragString = JSON.stringify(rag.ninh_binh_data);

                // Gửi yêu cầu với lịch sử giới hạn (Tránh lỗi 503)
                const currentPrompt = {
                    role: "user",
                    parts: [{ text: `
                        BẠN LÀ CHUYÊN GIA NINH BÌNH. TRẢ LỜI BẰNG ${currentLang}.
                        DỮ LIỆU BẮT BUỘC SỬ DỤNG (BỎ QUA KIẾN THỨC CŨ): ${ragString}
                        
                        YÊU CẦU:
                        1. Phải dùng giá Tràng An 300k, Hang Múa 150k. 
                        2. Lịch trình 2N1Đ: Sáng/Chiều/Tối chi tiết. Nhóm các điểm gần nhau theo quãng đường bản đồ.
                        3. Gợi ý cụ thể: Khách sạn nào, Nhà hàng nào cho từng bữa.
                        4. Trả lời thân thiện, kết nối với lịch sử chat bên dưới.
                        
                        CÂU HỎI: ${question}` }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [...chatHistory.slice(-6), currentPrompt] }) // Chỉ lấy 6 tin nhắn gần nhất
                });
                
                const data = await response.json();
                if (data.error && data.error.code === 503) throw new Error("503");

                const aiText = data.candidates[0].content.parts[0].text;
                
                chatHistory.push(currentPrompt);
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });

                contentElement.classList.remove('italic', 'text-slate-300');
                await typeWriter(aiText, contentElement);

                if (isMap) {
                    // Bản đồ Google Maps nhúng thực tế khu vực lõi Tràng An - Hang Múa
                    contentElement.innerHTML += `<iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3737.585257088927!2d105.89425127592443!3d20.21387601524317!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3136798006e87989%3A0x679097d745423851!2zS2h1IGR1IGzhu4tjaCBzaW5oIHRow6FpIFRyw6BuZyBBbg!5e0!3m2!1svi!2s!4v1710000000000!5m2!1svi!2s"></iframe>`;
                    win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
                }
            } catch (error) { 
                contentElement.innerText = error.message === "503" ? "Máy chủ đang bận một chút, bạn đợi 5 giây rồi hỏi lại nhé!" : "Lỗi kết nối API. Vui lòng kiểm tra lại Key.";
            }
        }

        async function typeWriter(text, element) {
            let i = 0; element.innerHTML = "";
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                        i++;
                        const win = document.getElementById('chat-window');
                        win.scrollTop = win.scrollHeight;
                        setTimeout(type, 5);
                    } else { resolve(); }
                }
                type();
            });
        }

        function handleSend() { const input = document.getElementById('userInput'); if (input.value.trim()) { askAI(input.value); input.value = ''; } }
        function goHome() { document.getElementById('welcome-screen').classList.remove('hidden'); document.getElementById('chat-container').innerHTML = ''; chatHistory = []; }
        function clearChat() { if(confirm("Xóa hội thoại?")) goHome(); }
        window.onload = () => { if (!apiKey) showApiModal(); };
    </script>
</body>
</html>
