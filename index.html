<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Chatbot tư vấn lịch trình du lịch Ninh Bình 2 ngày 1 đêm">
  <title>Ninh Bình Travel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="weather-badge" id="weather-badge">🌤️ Đang tải...</div>
    <h1>Ninh Bình Travel</h1>
    <div class="header-actions">
      <span class="disclaimer">thông tin mang tính chất tham khảo</span>
      <button id="clear-chat" aria-label="Xóa trò chuyện" title="Xóa lịch sử chat">🗑️</button>
    </div>
  </header>

  <main>
    <section id="api-panel">
      <input type="password" id="api-key" placeholder="Nhập Gemini API Key của bạn..." autocomplete="off">
      <button id="api-save" class="btn primary">Lưu Key</button>
      <p id="api-status" class="status"></p>
    </section>

    <section id="chat-container" role="log" aria-live="polite">
      <div id="messages"></div>
      
      <div id="suggestions" class="suggestions-grid">
        <button class="chip" data-msg="👩‍❤️‍👨 Gợi ý chương trình 2N1Đ cho couple/gia đình">👩‍❤️‍👨 Couple/Gia đình 2N1Đ</button>
        <button class="chip" data-msg="💰 Lịch trình ngân sách khoảng 2 triệu/người">💰 Ngân sách ~2 triệu</button>
        <button class="chip" data-msg="⚡ Chương trình trốn phố 24h tại Ninh Bình">⚡ Trốn phố 24h</button>
        <button class="chip" data-msg="🏍️ Lịch trình xe máy tự túc 2 ngày 1 đêm">🏍️ Xe máy tự túc</button>
      </div>

      <div id="loading" class="hidden" aria-label="Đang tạo phản hồi...">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </section>

    <form id="input-form" autocomplete="off">
      <textarea id="user-input" rows="2" placeholder="Hỏi về lịch trình, địa điểm ăn uống, lưu trú tại Ninh Bình..." required></textarea>
      <button type="submit" id="send-btn" class="btn accent" aria-label="Gửi tin nhắn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
