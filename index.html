<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Bình AI Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        .map-frame { width: 100%; height: 350px; border-radius: 24px; border: 2px solid #fff; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); margin-top: 15px; }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <header class="h-16 flex justify-between items-center bg-white/80 backdrop-blur-md border-b px-6 shrink-0 z-50 sticky top-0">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
            <div class="bg-emerald-600 text-white p-2 rounded-xl"><i class="fas fa-mountain"></i></div>
            <h1 class="text-lg font-bold text-emerald-800">Ninh Bình AI</h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <span class="text-[11px] text-slate-400 italic hidden md:block">Thông tin mang tính chất tham khảo</span>
            
            <button onclick="clearChat()" class="text-red-500 hover:bg-red-50 w-9 h-9 rounded-full transition"><i class="fas fa-trash-alt"></i></button>
            <button onclick="showApiModal()" class="text-amber-500 hover:bg-amber-50 w-9 h-9 rounded-full"><i class="fas fa-key"></i></button>
            <button onclick="toggleLang()" id="langBtn" class="px-4 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-bold">EN</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col overflow-hidden relative">
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-6 pb-32">
            <div id="welcome-screen" class="py-12 text-center space-y-8">
                <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Khám phá Ninh Bình<br><span class="text-emerald-600 underline decoration-emerald-200">Theo cách của bạn</span></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
                    <button onclick="askAI(translations[currentLang].sug1)" class="p-6 bg-white border rounded-3xl text-left hover:shadow-xl hover:border-emerald-500 transition-all group">
                        <i class="fas fa-map-marked-alt text-2xl text-emerald-500 mb-3 group-hover:scale-110 transition"></i>
                        <div class="font-bold">Lịch trình chi tiết 2026</div>
                        <div class="text-[11px] text-slate-400 mt-1">Kết hợp các điểm tham quan, giá vé và nơi ở.</div>
                    </button>
                    <button onclick="askAI(translations[currentLang].sug2)" class="p-6 bg-white border rounded-3xl text-left hover:shadow-xl hover:border-orange-500 transition-all group">
                        <i class="fas fa-utensils text-2xl text-orange-500 mb-3 group-hover:scale-110 transition"></i>
                        <div class="font-bold">Đặc sản & Nhà hàng</div>
                        <div class="text-[11px] text-slate-400 mt-1">Tìm nơi ăn ngon nhất gần chỗ bạn ở.</div>
                    </button>
                </div>
            </div>
            <div id="chat-container" class="space-y-6"></div>
        </div>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-slate-50 via-white/90 to-transparent">
            <div class="max-w-3xl mx-auto bg-white border-2 border-emerald-100 shadow-2xl rounded-3xl p-1.5 flex items-center">
                <input type="text" id="userInput" placeholder="Nhập tin nhắn..." class="flex-1 p-4 outline-none text-sm font-medium" onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" class="bg-emerald-600 text-white w-12 h-12 rounded-2xl hover:bg-emerald-700 transition shadow-lg shadow-emerald-200">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <div id="api-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] hidden p-4">
        <div class="bg-white p-8 rounded-[32px] max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-center">Cấu hình API Key</h3>
            <input type="password" id="api-input" class="w-full p-4 border rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold">Bắt đầu trò chuyện</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentLang = 'vi';
        let chatHistory = [];

        const translations = {
            vi: {
                sug1: "Lập lịch trình 2 ngày 1 đêm chi tiết nhất. Tôi muốn đi Tràng An, Hang Múa. Hãy gợi ý cả khách sạn phù hợp và nhà hàng ăn tối ngon nhé.",
                sug2: "Tổng hợp giá vé các điểm tham quan Ninh Bình 2026 và các quán ăn dê núi uy tín.",
                thinking: "Đang phân tích dữ liệu..."
            },
            en: {
                sug1: "Create a detailed 2D1N itinerary. I want to visit Trang An and Mua Cave. Suggest suitable hotels and good dinner restaurants.",
                sug2: "Summarize 2026 ticket prices and reputable mountain goat restaurants.",
                thinking: "Analyzing data..."
            }
        };

        function toggleLang() { currentLang = currentLang === 'vi' ? 'en' : 'vi'; document.getElementById('langBtn').innerText = currentLang === 'vi' ? 'EN' : 'VI'; }
        function showApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function saveApiKey() {
            const val = document.getElementById('api-input').value.trim();
            if(val) { apiKey = val; localStorage.setItem('gemini_api_key', val); document.getElementById('api-modal').classList.add('hidden'); }
        }

        async function fetchAllData() {
            try {
                // Đọc cùng lúc 3 file dữ liệu
                const [kd, lt, nh] = await Promise.all([
                    fetch('khudiem.json').then(r => r.json()),
                    fetch('luutru.json').then(r => r.json()),
                    fetch('nhahang.json').then(r => r.json())
                ]);
                return `
                    DỮ LIỆU ĐIỂM THAM QUAN: ${JSON.stringify(kd)}
                    DỮ LIỆU LƯU TRÚ: ${JSON.stringify(lt)}
                    DỮ LIỆU NHÀ HÀNG: ${JSON.stringify(nh)}
                `;
            } catch (e) { return "Không thể nạp dữ liệu."; }
        }

        async function askAI(question) {
            if(!apiKey) return showApiModal();
            document.getElementById('welcome-screen').classList.add('hidden');
            const container = document.getElementById('chat-container');
            const isMap = question.toLowerCase().includes('lịch trình') || question.toLowerCase().includes('itinerary');

            container.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 text-white p-4 rounded-3xl rounded-tr-none max-w-[85%] text-sm shadow-md">${question}</div></div>`;
            
            const aiBox = document.createElement('div');
            aiBox.className = "flex justify-start items-start space-x-3";
            aiBox.innerHTML = `<div class="bg-white p-5 rounded-3xl rounded-tl-none max-w-[95%] text-sm text-slate-700 shadow-sm border border-slate-100 italic text-slate-400">${translations[currentLang].thinking}</div>`;
            container.appendChild(aiBox);
            const contentElement = aiBox.querySelector('div');
            const win = document.getElementById('chat-window');
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });

            try {
                const combinedData = await fetchAllData();
                
                const currentPrompt = {
                    role: "user",
                    parts: [{ text: `
                        BẠN LÀ CHUYÊN GIA BẢN ĐỊA NINH BÌNH. TRẢ LỜI BẰNG ${currentLang}.
                        SỬ DỤNG DỮ LIỆU NÀY ĐỂ TRẢ LỜI (BẮT BUỘC): ${combinedData}
                        
                        YÊU CẦU QUAN TRỌNG:
                        1. Tính kết nối: Phải dựa vào lịch sử chat bên dưới để trả lời tiếp nối, không bắt đầu lại từ đầu.
                        2. Chi tiết: Lịch trình phải có Sáng/Chiều/Tối, có giá vé cụ thể từ dữ liệu. 
                        3. Gợi ý khách sạn & nhà hàng phải khớp với vị trí tham quan để khách đỡ phải đi xa.
                        4. Thân thiện: Dùng ngôn ngữ như người bản xứ đang tư vấn cho bạn.
                        5. Lưu ý: Check-in 14h, Check-out 12h.
                        
                        CÂU HỎI HIỆN TẠI: ${question}` }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [...chatHistory.slice(-6), currentPrompt] })
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                chatHistory.push(currentPrompt);
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });

                contentElement.classList.remove('italic', 'text-slate-400');
                await typeWriter(aiText, contentElement);

                if (isMap) {
                    contentElement.innerHTML += `<iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d59740.34752661571!2d105.89518501255567!3d20.22676735579997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1zVHLDoG5nIEFuLCBIYW5nIE3DumEsIFBo4buRIEPhu5UgSG9hIEzGsA!5e0!3m2!1svi!2s!4v17111111111111"></iframe>`;
                    win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
                }
            } catch (error) { contentElement.innerText = "Máy chủ Gemini đang quá tải (Lỗi 503), bạn vui lòng chờ vài giây rồi gửi lại nhé!"; }
        }

        async function typeWriter(text, element) {
            let i = 0; element.innerHTML = "";
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                        i++;
                        const win = document.getElementById('chat-window');
                        win.scrollTop = win.scrollHeight;
                        setTimeout(type, 5);
                    } else { resolve(); }
                }
                type();
            });
        }

        function handleSend() { const input = document.getElementById('userInput'); if (input.value.trim()) { askAI(input.value); input.value = ''; } }
        function goHome() { document.getElementById('welcome-screen').classList.remove('hidden'); document.getElementById('chat-container').innerHTML = ''; chatHistory = []; }
        function clearChat() { if(confirm("Xóa lịch sử trò chuyện?")) goHome(); }
    </script>
</body>
</html>
