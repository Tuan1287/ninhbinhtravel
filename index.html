<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Bình AI - Chuyên gia du lịch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .map-frame { width: 100%; height: 300px; border-radius: 20px; border: 1px solid #e2e8f0; margin-top: 15px; }
    </style>
</head>
<body class="text-slate-800">

    <div id="api-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] hidden p-4">
        <div class="bg-white p-6 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <h3 class="text-lg font-bold mb-4">Cấu hình API Gemini</h3>
            <input type="password" id="api-input" placeholder="Dán API Key vào đây..." class="w-full p-4 border rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-emerald-500 text-center">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white py-3 rounded-2xl font-bold hover:bg-emerald-700">Kích hoạt</button>
        </div>
    </div>

    <header class="h-16 flex justify-between items-center bg-white border-b px-4 sm:px-8 shrink-0 shadow-sm z-50">
        <div class="flex items-center space-x-4">
            <div class="cursor-pointer" onclick="goHome()">
                <h1 class="text-base font-bold text-emerald-700 leading-none">Ninh Bình AI</h1>
                <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest" id="h-tag">Local Expert</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span class="hidden md:block text-[10px] text-slate-400 italic font-medium mr-2" id="ref-text">Thông tin mang tính chất tham khảo</span>
            
            <button onclick="clearChat()" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition" title="Xóa hội thoại">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button onclick="showApiModal()" class="p-2 text-amber-500 hover:bg-amber-50 rounded-lg transition">
                <i class="fas fa-key"></i>
            </button>
            <button onclick="toggleLang()" id="langBtn" class="px-3 py-1 border-2 border-emerald-600 text-emerald-600 rounded-lg text-xs font-bold transition">EN</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full relative flex-1 flex flex-col overflow-hidden">
        <div id="chat-window" class="flex-1 overflow-y-auto px-4 pt-6 pb-32">
            <div id="welcome-screen" class="py-10 text-center animate-fade-in">
                <h2 class="text-3xl font-bold mb-10 text-slate-900" id="w-text">Lên kế hoạch du lịch Ninh Bình cùng chuyên gia</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
                    <div onclick="askAI(translations[currentLang].sug1)" class="p-6 bg-white border rounded-2xl cursor-pointer hover:border-emerald-500 transition-all text-left shadow-sm">
                        <i class="fas fa-route text-emerald-500 mb-2"></i>
                        <h3 class="font-bold text-sm" id="s1-t">Lịch trình chi tiết 2N1Đ</h3>
                        <p class="text-[10px] text-slate-400 mt-1" id="s1-d">Đầy đủ giá vé, quán ăn và bản đồ di chuyển.</p>
                    </div>
                    <div onclick="askAI(translations[currentLang].sug2)" class="p-6 bg-white border rounded-2xl cursor-pointer hover:border-orange-500 transition-all text-left shadow-sm">
                        <i class="fas fa-utensils text-orange-500 mb-2"></i>
                        <h3 class="font-bold text-sm" id="s2-t">Ẩm thực & Giá vé 2026</h3>
                        <p class="text-[10px] text-slate-400 mt-1" id="s2-d">Cập nhật bảng giá và địa điểm ăn uống uy tín.</p>
                    </div>
                </div>
            </div>
            <div id="chat-container" class="space-y-6"></div>
        </div>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-f1f5f9 via-f1f5f9 to-transparent">
            <div class="max-w-2xl mx-auto relative shadow-2xl rounded-2xl bg-white border p-1">
                <input type="text" id="userInput" placeholder="Hỏi mình về lịch trình, giá vé..." 
                    class="w-full p-4 pr-16 focus:outline-none text-sm"
                    onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" class="absolute right-2 top-2 bg-emerald-600 text-white w-10 h-10 rounded-xl flex items-center justify-center">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentLang = 'vi';
        let chatHistory = []; // BỘ NHỚ CỦA AI

        const translations = {
            vi: {
                wText: "Lên kế hoạch du lịch Ninh Bình cùng chuyên gia",
                hTag: "Local Expert",
                iPlace: "Hỏi mình về lịch trình, giá vé...",
                refText: "Thông tin mang tính chất tham khảo",
                sug1: "Hãy lập cho mình một lịch trình du lịch Ninh Bình 2 ngày 1 đêm thật chi tiết. Nhóm mình muốn đi Tràng An, Hang Múa, Chùa Bái Đính. Hãy sắp xếp các điểm gần nhau đi cùng buổi, gợi ý cả quán ăn đặc sản và khách sạn nhé.",
                sug1T: "Lịch trình chi tiết 2N1Đ",
                sug1D: "Đầy đủ giá vé, quán ăn và bản đồ di chuyển.",
                sug2: "Cho mình biết giá vé các điểm du lịch tại Ninh Bình năm 2026 và gợi ý địa chỉ mua quà uy tín.",
                sug2T: "Ẩm thực & Giá vé 2026",
                sug2D: "Cập nhật bảng giá và địa điểm ăn uống uy tín.",
                thinking: "Đang tính toán lịch trình cho bạn..."
            },
            en: {
                wText: "Plan your Ninh Binh trip with a local expert",
                hTag: "Local Expert",
                iPlace: "Ask about itineraries, tickets...",
                refText: "Information for reference only",
                sug1: "Please create a detailed 2D1N Ninh Binh itinerary. We want to visit Trang An, Mua Cave, and Bai Dinh. Please group nearby spots together, suggest local specialty restaurants, and hotels.",
                sug1T: "Detailed 2D1N Plan",
                sug1D: "Full ticket prices, restaurants, and maps.",
                sug2: "Show me Ninh Binh 2026 ticket prices and reputable souvenir shops.",
                sug2T: "Food & Tickets 2026",
                sug2D: "Updated pricing and trusted local eateries.",
                thinking: "Planning your trip..."
            }
        };

        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('w-text').innerText = t.wText;
            document.getElementById('h-tag').innerText = t.hTag;
            document.getElementById('ref-text').innerText = t.refText;
            document.getElementById('userInput').placeholder = t.iPlace;
            document.getElementById('s1-t').innerText = t.sug1T;
            document.getElementById('s1-d').innerText = t.sug1D;
            document.getElementById('s2-t').innerText = t.sug2T;
            document.getElementById('s2-d').innerText = t.sug2D;
            document.getElementById('langBtn').innerText = currentLang === 'vi' ? 'EN' : 'VI';
        }

        function toggleLang() { currentLang = currentLang === 'vi' ? 'en' : 'vi'; updateUILanguage(); }
        function showApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function saveApiKey() {
            const val = document.getElementById('api-input').value.trim();
            if(val) { apiKey = val; localStorage.setItem('gemini_api_key', val); document.getElementById('api-modal').classList.add('hidden'); }
        }

        async function getRAGData(query) {
            try {
                const res = await fetch('data.json');
                const db = await res.json();
                return db.ninh_binh_data.map(i => `${i.name}: ${i.hidden_note}`).join('\n');
            } catch (e) { return ""; }
        }

        async function askAI(question) {
            if(!apiKey) return showApiModal();
            document.getElementById('welcome-screen').classList.add('hidden');
            const container = document.getElementById('chat-container');
            const isMap = question.toLowerCase().includes('lịch trình') || question.toLowerCase().includes('itinerary');

            container.innerHTML += `<div class="flex justify-end mb-2"><div class="bg-emerald-600 text-white p-3 px-5 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-sm">${question}</div></div>`;
            
            const aiBox = document.createElement('div');
            aiBox.className = "flex justify-start mb-4";
            aiBox.innerHTML = `<div class="bg-white p-5 rounded-2xl rounded-tl-none max-w-[90%] text-sm text-slate-700 leading-relaxed shadow-sm italic text-slate-300 border border-slate-100">${translations[currentLang].thinking}</div>`;
            container.appendChild(aiBox);
            const contentElement = aiBox.querySelector('div');
            const win = document.getElementById('chat-window');
            win.scrollTop = win.scrollHeight;

            try {
                const rag = await getRAGData(question);
                
                // THIẾT LẬP NỘI DUNG GỬI ĐI (BAO GỒM LỊCH SỬ)
                const currentMessage = {
                    role: "user",
                    parts: [{ text: `
                        Bạn là một chuyên gia du lịch Ninh Bình sành sỏi. 
                        NHIỆM VỤ: Lập lịch trình cực kỳ chi tiết, tính toán quãng đường logic giữa các điểm.
                        DỮ LIỆU GIÁ VÉ & THÔNG TIN (DÙNG ĐỂ TƯ VẤN): ${rag}
                        
                        YÊU CẦU:
                        1. Phản hồi bằng ${currentLang}.
                        2. Lịch trình phải phân bổ theo Sáng/Chiều/Tối. Ghi rõ giá vé từng điểm.
                        3. Gợi ý cụ thể nhà hàng ăn uống cho từng bữa và khách sạn lưu trú.
                        4. Dựa trên lịch sử trò chuyện phía dưới để trả lời tiếp nối, không lặp lại thừa thãi.
                        5. Nhắc nhở check-in 14h, check-out 12h.
                        6. Trả lời thân thiện, có chiều sâu tương tác.

                        CÂU HỎI HIỆN TẠI: ${question}` }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [...chatHistory, currentMessage] })
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                // Lưu vào lịch sử chat
                chatHistory.push(currentMessage);
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });

                contentElement.classList.remove('italic', 'text-slate-300');
                await typeWriter(aiText, contentElement);

                if (isMap) {
                    contentElement.innerHTML += `<iframe class="map-frame" src="http://googleusercontent.com/maps.google.com/9"></iframe>`;
                    win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
                }
            } catch (error) { contentElement.innerText = "Lỗi kết nối. Vui lòng kiểm tra API Key."; }
        }

        async function typeWriter(text, element) {
            let i = 0; element.innerHTML = "";
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                        i++;
                        const win = document.getElementById('chat-window');
                        win.scrollTop = win.scrollHeight;
                        setTimeout(type, 5);
                    } else { resolve(); }
                }
                type();
            });
        }

        function handleSend() { const input = document.getElementById('userInput'); if (input.value.trim()) { askAI(input.value); input.value = ''; } }
        function goHome() { document.getElementById('welcome-screen').classList.remove('hidden'); document.getElementById('chat-container').innerHTML = ''; chatHistory = []; }
        function clearChat() { if(confirm("Xóa hội thoại và lịch sử nhớ?")) goHome(); }
        window.onload = () => { updateUILanguage(); if (!apiKey) showApiModal(); };
    </script>
</body>
</html>
