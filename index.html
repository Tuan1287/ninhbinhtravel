<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ninh Bình Travel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="weather-badge" id="weather-badge">🌤️ Loading...</div>
    <h1 id="site-title">Ninh Bình Travel</h1>
    <div class="header-actions">
      <button id="lang-toggle" class="lang-btn">VI / EN</button>
      <span class="disclaimer" id="disclaimer">thông tin mang tính chất tham khảo</span>
      <button id="clear-chat" aria-label="Xóa trò chuyện">🗑️</button>
    </div>
  </header>

  <main>
    <section id="api-panel">
      <input type="password" id="api-key" placeholder="Nhập Gemini API Key..." autocomplete="off">
      <button id="api-save" class="btn primary">Lưu Key</button>
      <p id="api-status" class="status"></p>
    </section>

    <section id="chat-container">
      <div id="messages"></div>
      
      <div id="suggestions" class="suggestions-grid">
        <button class="chip" data-msg="couple">👩‍❤️‍👨 Couple/Gia đình 2N1Đ</button>
        <button class="chip" data-msg="budget">💰 Ngân sách ~2 triệu</button>
        <button class="chip" data-msg="escape">⚡ Trốn phố 24h</button>
        <button class="chip" data-msg="motorbike">🏍️ Xe máy tự túc</button>
      </div>

      <div id="loading" class="hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </section>

    <form id="input-form">
      <textarea id="user-input" rows="2" placeholder="Hỏi về Ninh Bình..." required></textarea>
      <button type="submit" id="send-btn" class="btn accent">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
