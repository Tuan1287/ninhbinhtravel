<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Bình AI Insider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background-color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
        .chat-bubble { line-height: 1.6; }
        .chat-bubble b { color: #059669; font-weight: 700; } /* Làm nổi bật các tiêu đề thay cho dấu sao */
        .map-frame { width: 100%; height: 350px; border-radius: 20px; border: 1px solid #e2e8f0; margin-top: 15px; }
        #chat-window::-webkit-scrollbar { width: 4px; }
        #chat-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <header class="h-16 flex justify-between items-center bg-white border-b px-4 sm:px-8 shrink-0 shadow-sm z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-100">
                <i class="fas fa-leaf"></i>
            </div>
            <h1 class="text-lg font-bold text-emerald-800">Ninh Bình AI</h1>
        </div>
        
        <div class="flex items-center space-x-2">
            <span id="ref-text" class="text-[10px] text-slate-400 italic hidden md:block mr-2">Thông tin mang tính chất tham khảo</span>
            <button onclick="clearChat()" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition"><i class="fas fa-trash-alt"></i></button>
            <button onclick="showApiModal()" class="p-2 text-amber-500 hover:bg-amber-50 rounded-lg"><i class="fas fa-key"></i></button>
            <button onclick="toggleLang()" id="langBtn" class="px-4 py-1.5 border-2 border-emerald-600 text-emerald-600 rounded-full text-xs font-bold transition-all">EN</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col overflow-hidden relative">
        <div id="chat-window" class="flex-1 overflow-y-auto px-4 pt-8 pb-32">
            <div id="welcome-screen" class="text-center py-10 animate-fade-in">
                <h2 id="w-title" class="text-3xl font-bold text-slate-900 mb-8">Chào mừng bạn đến với Ninh Bình!</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
                    <button onclick="askAI(translations[currentLang].sug1)" class="p-6 bg-white border rounded-2xl text-left hover:border-emerald-500 shadow-sm transition-all group">
                        <i class="fas fa-route text-emerald-500 mb-3 block text-xl group-hover:scale-110 transition"></i>
                        <div id="s1-t" class="font-bold text-sm">Lịch trình 2 ngày 1 đêm</div>
                        <div id="s1-d" class="text-[11px] text-slate-400 mt-1">Chi tiết điểm đến, nơi ở và ăn uống.</div>
                    </button>
                    <button onclick="askAI(translations[currentLang].sug2)" class="p-6 bg-white border rounded-2xl text-left hover:border-orange-500 shadow-sm transition-all group">
                        <i class="fas fa-utensils text-orange-500 mb-3 block text-xl group-hover:scale-110 transition"></i>
                        <div id="s2-t" class="font-bold text-sm">Ăn gì & Ở đâu?</div>
                        <div id="s2-d" class="text-[11px] text-slate-400 mt-1">Danh sách nhà hàng và khách sạn uy tín.</div>
                    </button>
                </div>
            </div>
            <div id="chat-container" class="space-y-6"></div>
        </div>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-f1f5f9 via-white/80 to-transparent">
            <div class="max-w-2xl mx-auto bg-white border shadow-2xl rounded-2xl p-1.5 flex items-center">
                <input type="text" id="userInput" class="flex-1 p-3 outline-none text-sm font-medium" onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" class="bg-emerald-600 text-white w-10 h-10 rounded-xl hover:bg-emerald-700 transition">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <div id="api-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] hidden p-4">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <h3 class="text-xl font-bold mb-4">Cấu hình API Key</h3>
            <input type="password" id="api-input" class="w-full p-4 border rounded-xl mb-4 text-center outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Lưu lại</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentLang = 'vi';
        let chatHistory = []; // Bộ nhớ hội thoại

        const translations = {
            vi: {
                wTitle: "Chào mừng bạn đến với Ninh Bình!",
                s1t: "Lịch trình 2 ngày 1 đêm",
                s1d: "Chi tiết điểm đến, nơi ở và ăn uống.",
                s2t: "Ăn gì & Ở đâu?",
                s2d: "Danh sách nhà hàng và khách sạn uy tín.",
                ref: "Thông tin mang tính chất tham khảo",
                place: "Hỏi mình bất cứ điều gì về Ninh Bình...",
                sug1: "Lập lịch trình 2 ngày 1 đêm đi Tràng An, Hang Múa, Chùa Bái Đính. Gợi ý luôn khách sạn và nhà hàng gần các điểm này.",
                sug2: "Cho mình danh sách các khách sạn tốt và quán ăn dê núi ngon tại Ninh Bình.",
                thinking: "Đang phân tích dữ liệu..."
            },
            en: {
                wTitle: "Welcome to Ninh Binh!",
                s1t: "2 Days 1 Night Itinerary",
                s1d: "Detailed attractions, stays, and dining.",
                s2t: "Where to Eat & Stay?",
                s2d: "List of reputable hotels and restaurants.",
                ref: "Information for reference only",
                place: "Ask me anything about Ninh Binh...",
                sug1: "Create a 2D1N itinerary for Trang An, Mua Cave, and Bai Dinh. Suggest nearby hotels and restaurants.",
                sug2: "Give me a list of good hotels and goat meat restaurants in Ninh Binh.",
                thinking: "Analyzing data..."
            }
        };

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('w-title').innerText = t.wTitle;
            document.getElementById('s1-t').innerText = t.s1t;
            document.getElementById('s1-d').innerText = t.s1d;
            document.getElementById('s2-t').innerText = t.s2t;
            document.getElementById('s2-d').innerText = t.s2d;
            document.getElementById('ref-text').innerText = t.ref;
            document.getElementById('userInput').placeholder = t.place;
            document.getElementById('langBtn').innerText = currentLang === 'vi' ? 'EN' : 'VI';
        }

        function toggleLang() { currentLang = currentLang === 'vi' ? 'en' : 'vi'; updateUI(); }
        function showApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
        function saveApiKey() {
            const val = document.getElementById('api-input').value.trim();
            if(val) { apiKey = val; localStorage.setItem('gemini_api_key', val); document.getElementById('api-modal').classList.add('hidden'); }
        }

        async function fetchAllData() {
            try {
                const [kd, lt, nh] = await Promise.all([
                    fetch('khudiem.json').then(r => r.json()),
                    fetch('luutru.json').then(r => r.json()),
                    fetch('nhahang.json').then(r => r.json())
                ]);
                return `Dữ liệu điểm đến: ${JSON.stringify(kd)}\nDữ liệu lưu trú: ${JSON.stringify(lt)}\nDữ liệu nhà hàng: ${JSON.stringify(nh)}`;
            } catch (e) { return "Lỗi nạp dữ liệu."; }
        }

        async function askAI(question) {
            if(!apiKey) return showApiModal();
            document.getElementById('welcome-screen').classList.add('hidden');
            const container = document.getElementById('chat-container');
            const isMap = question.toLowerCase().includes('lịch trình') || question.toLowerCase().includes('itinerary');

            container.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-md">${question}</div></div>`;
            
            const aiBox = document.createElement('div');
            aiBox.className = "flex justify-start";
            aiBox.innerHTML = `<div class="bg-white p-5 rounded-2xl rounded-tl-none max-w-[95%] text-sm text-slate-700 shadow-sm border border-slate-100 italic text-slate-300 chat-bubble">${translations[currentLang].thinking}</div>`;
            container.appendChild(aiBox);
            const contentElement = aiBox.querySelector('div');
            const win = document.getElementById('chat-window');
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });

            try {
                const combinedData = await fetchAllData();
                const systemPrompt = {
                    role: "user",
                    parts: [{ text: `
                        BẠN LÀ CHUYÊN GIA NINH BÌNH TRẢ LỜI BẰNG ${currentLang}. 
                        DỮ LIỆU GỐC: ${combinedData}
                        
                        YÊU CẦU UX CỰC QUAN TRỌNG:
                        1. TUYỆT ĐỐI KHÔNG sử dụng dấu sao (**) để nhấn mạnh hay tạo danh sách. 
                        2. Hãy sử dụng Emoji làm đầu dòng (📍, 🕒, 🏨, 🍽️, 💰, ✅).
                        3. Xuống dòng rõ ràng giữa các phần để dễ đọc.
                        4. Dùng ngôn ngữ tự nhiên, thân thiện.
                        5. Kết nối: Dựa vào lịch sử chat bên dưới để trả lời tiếp nối. Nếu người dùng hỏi tiếp, hãy coi đó là một phần của hành trình đang tư vấn.
                        
                        CÂU HỎI HIỆN TẠI: ${question}` }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [...chatHistory.slice(-8), systemPrompt] })
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                chatHistory.push(systemPrompt);
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });

                contentElement.classList.remove('italic', 'text-slate-300');
                await typeWriter(aiText, contentElement);

                if (isMap) {
                    contentElement.innerHTML += `<iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d59740.34752661571!2d105.89518501255567!3d20.22676735579997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1zVHLDoG5nIEFuLCBIYW5nIE3DumEsIFBo4buRIEPhu5UgSG9hIEzGsA!5e0!3m2!1svi!2s!4v17111111111112"></iframe>`;
                    win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
                }
            } catch (error) { contentElement.innerText = "Hệ thống đang bận một chút, bạn thử lại sau 3 giây nhé!"; }
        }

        async function typeWriter(text, element) {
            let i = 0; element.innerHTML = "";
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                        i++;
                        const win = document.getElementById('chat-window');
                        win.scrollTop = win.scrollHeight;
                        setTimeout(type, 5);
                    } else { resolve(); }
                }
                type();
            });
        }

        function handleSend() { const input = document.getElementById('userInput'); if (input.value.trim()) { askAI(input.value); input.value = ''; } }
        function goHome() { document.getElementById('welcome-screen').classList.remove('hidden'); document.getElementById('chat-container').innerHTML = ''; chatHistory = []; }
        function clearChat() { if(confirm("Xóa lịch sử trò chuyện?")) goHome(); }
        window.onload = () => { updateUI(); if (!apiKey) showApiModal(); };
    </script>
</body>
</html>
